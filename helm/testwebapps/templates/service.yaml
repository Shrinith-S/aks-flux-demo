apiVersion: v1
kind: Service
metadata:
  name: {{ include "testwebapps.fullname" . }}-app1-svc
spec:
  selector:
    app: app1
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: {{ .Values.service.type }}

