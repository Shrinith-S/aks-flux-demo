{{- if and .Values.serviceAccount (or .Values.serviceAccount.create false) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "testwebapps.serviceAccountName" . }}
  labels:
    {{- include "testwebapps.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ default true .Values.serviceAccount.automount }}
{{- end }}
