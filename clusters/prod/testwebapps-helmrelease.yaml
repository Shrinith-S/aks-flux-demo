apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: testwebapps
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: ./helm/testwebapps
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    replicaCount: 2
    image:
      repository: shrinithdecos/testwebapp01
      tag: dev-01
    image2:
      repository: shrinithdecos/testwebapp02
      tag: dev-01
